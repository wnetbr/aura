<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso ao Sistema</title>
  <style>
    /* RESET & FONTES */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f0f9ff;
      color: #0f172a;
    }

    /* -------------------------------------------------------------
       TELA DE LOGIN / LOCKSCREEN (AZUL COM BRANCO)
    ------------------------------------------------------------- */
    #login-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top left, rgba(56, 189, 248, 0.35), transparent 50%),
                  radial-gradient(circle at bottom right, rgba(37, 99, 235, 0.25), transparent 50%),
                  linear-gradient(135deg, #e0f2fe 0%, #bae6fd 50%, #f0f9ff 100%);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), 
                  transform 0.5s cubic-bezier(0.16, 1, 0.3, 1),
                  visibility 0.5s;
    }

    /* CLASSE ATIVADA PARA SUMIR COM A TELA */
    #login-overlay.hidden {
      opacity: 0;
      transform: scale(1.08);
      pointer-events: none;
      visibility: hidden;
    }

    /* CARD DE LOGIN (GLASSMORPHISM BRANCO E AZUL) */
    .login-card {
      width: 100%;
      max-width: 380px;
      padding: 40px 30px;
      margin: 20px;
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 32px;
      box-shadow: 0 25px 50px -12px rgba(14, 165, 233, 0.25),
                  0 0 0 1px rgba(186, 230, 253, 0.5);
      text-align: center;
      position: relative;
    }

    /* ANIMAÇÃO DE ERRO (SHAKE) */
    .login-card.shake {
      animation: shake 0.4s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-12px); }
      40%, 80% { transform: translateX(12px); }
    }

    /* ÍCONE SUPERIOR */
    .avatar-icon {
      width: 76px;
      height: 76px;
      margin: 0 auto 20px;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      border: 3px solid #ffffff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      box-shadow: 0 10px 20px rgba(2, 132, 199, 0.3);
      color: #ffffff;
    }

    .login-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }

    .login-subtitle {
      font-size: 0.88rem;
      color: #0369a1;
      margin-bottom: 28px;
      font-weight: 500;
    }

    /* CAMPO DE SENHA */
    .input-group {
      position: relative;
      margin-bottom: 12px;
    }

    .password-input {
      width: 100%;
      padding: 16px 20px;
      background: #ffffff;
      border: 2px solid #bae6fd;
      border-radius: 18px;
      color: #0f172a;
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 2px;
      text-align: center;
      outline: none;
      transition: all 0.25s ease;
      box-shadow: 0 2px 8px rgba(2, 132, 199, 0.05);
    }

    .password-input:focus {
      border-color: #0284c7;
      box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.18);
      background: #ffffff;
    }

    .password-input::placeholder {
      letter-spacing: normal;
      font-size: 0.9rem;
      color: #94a3b8;
      font-weight: 400;
    }

    /* MENSAGEM DE STATUS / ERRO */
    .status-message {
      min-height: 22px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 16px;
      transition: all 0.2s;
    }

    .status-message.error {
      color: #ef4444;
    }

    .status-message.success {
      color: #16a34a;
    }

    /* BOTÃO DE ENTRAR */
    .btn-submit {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #0284c7, #1d4ed8);
      border: none;
      border-radius: 18px;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 10px 20px rgba(2, 132, 199, 0.35);
    }

    .btn-submit:hover {
      opacity: 0.95;
      transform: translateY(-1px);
      box-shadow: 0 12px 24px rgba(2, 132, 199, 0.45);
    }

    .btn-submit:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <!-- TELA DE ACESSO (SUMIRÁ COMPLETAMENTE DO DOM AO ACERTAR) -->
  <div id="login-overlay">
    <div class="login-card" id="login-card">
      <div class="avatar-icon">🔒</div>
      <h2 class="login-title">Acesso Restrito</h2>
      <p class="login-subtitle">Digite sua senha para desbloquear</p>

      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="input-group">
          <input 
            type="password" 
            id="password-input" 
            class="password-input" 
            placeholder="Sua senha..." 
            autocomplete="current-password"
            required
            autofocus
          >
        </div>

        <div id="status-message" class="status-message"></div>

        <button type="submit" class="btn-submit">Acessar Sistema</button>
      </form>
    </div>
  </div>

  <!-- O CONTEÚDO DO SEU APLICATIVO FICA AQUI EMBAIXO -->

  <script>
    /* BANCO DE DADOS LOCAL (INTERNO) */
    const Database = {
      STORAGE_KEY: 'app_user_password',
      // DEFINA A SUA SENHA PADRÃO AQUI:
      DEFAULT_PASSWORD: 'wnet.blog',

      init() {
        if (!localStorage.getItem(this.STORAGE_KEY)) {
          localStorage.setItem(this.STORAGE_KEY, this.DEFAULT_PASSWORD);
        }
      },
      validatePassword(inputPassword) {
        return inputPassword === localStorage.getItem(this.STORAGE_KEY);
      },
      // Função disponível para alterar a senha internamente quando precisar
      updatePassword(newPassword) {
        localStorage.setItem(this.STORAGE_KEY, newPassword);
      }
    };

    Database.init();

    const overlay = document.getElementById('login-overlay');
    const loginCard = document.getElementById('login-card');
    const passwordInput = document.getElementById('password-input');
    const statusMessage = document.getElementById('status-message');

    function handleLogin(event) {
      event.preventDefault();

      if (Database.validatePassword(passwordInput.value)) {
        statusMessage.className = 'status-message success';
        statusMessage.textContent = 'Acesso liberado!';

        // Animação de esvanecer
        overlay.classList.add('hidden');

        // Apaga a tela de login do código HTML após 0.5s
        setTimeout(() => {
          overlay.remove();
        }, 500);

      } else {
        // Se errar: limpa o campo de caracteres, vibra o card e mostra mensagem
        passwordInput.value = '';
        statusMessage.className = 'status-message error';
        statusMessage.textContent = 'Acesso negado.';

        loginCard.classList.remove('shake');
        void loginCard.offsetWidth; 
        loginCard.classList.add('shake');
        passwordInput.focus();
      }
    }
  </script>
</body>
</html>
